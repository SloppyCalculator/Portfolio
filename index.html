                        <div class="bg-gray-100 text-black p-2 rounded text-center font-bold text-sm tracking-wide uppercase truncate">${title}</div>
                        <div class="tape-window mt-3">
                            <div class="tape-spool"></div><div class="tape-spool"></div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="w-full h-full flex flex-col md:flex-row gap-12 p-8 max-w-6xl items-center justify-center">
                    
                    <!-- Left: Cassette Rack -->
                    <div class="cassette-rack w-full md:w-1/3 flex flex-col gap-6 overflow-y-auto max-h-[80vh] pr-4 custom-scrollbar">
                        <h3 class="text-neon font-bold text-xl uppercase tracking-widest mb-2 border-b border-gray-700 pb-2 flex items-center justify-between">
                            <span>Archives</span>
                            <span class="text-xs text-gray-400 font-mono font-normal">CASSETTES</span>
                        </h3>
                        ${cassetteCards}
                    </div>

                    <!-- Right: CRT Setup -->
                    <div class="crt-setup w-full md:w-2/3 flex flex-col items-center justify-center">
                        <div class="crt-monitor w-full aspect-[4/3] p-8 flex flex-col">
                            <div class="scanlines absolute inset-0 pointer-events-none opacity-40 z-10"></div>
                            <div id="crt-screen-content" class="crt-text font-mono text-sm md:text-base lg:text-lg whitespace-pre-wrap z-0 flex-grow">
                                > SYSTEM ONLINE.
                                > AWAITING CASSETTE INSERTION...<span class="blinking-cursor"></span>
                            </div>
                        </div>
                        
                        <div id="tape-deck" class="mt-8 w-64 h-24 bg-[#1a1a1a] border-4 border-[#333] rounded-lg flex items-center justify-center text-gray-600 border-dashed transition-all shadow-[0_10px_20px_rgba(0,0,0,0.5)]">
                            <span class="font-bold tracking-widest text-sm">DROP CASSETTE HERE</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function bindSoftwareEvents() {
            const cassettes = document.querySelectorAll('.cassette');
            const deck = document.getElementById('tape-deck');
            const screen = document.getElementById('crt-screen-content');

            cassettes.forEach(cassette => {
                cassette.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', cassette.dataset.id);
                });
                cassette.addEventListener('click', () => {
                    playCassette(cassette.dataset.id, deck, screen);
                });
            });

            deck.addEventListener('dragover', (e) => {
                e.preventDefault();
                deck.classList.add('border-neon', 'text-neon');
            });
            deck.addEventListener('dragleave', () => {
                deck.classList.remove('border-neon', 'text-neon');
            });
            deck.addEventListener('drop', (e) => {
                e.preventDefault();
                deck.classList.remove('border-neon', 'text-neon');
                const id = e.dataTransfer.getData('text/plain');
                if(id) playCassette(id, deck, screen);
            });
        }

        const softwareData = {
            "1": "> BOOTING SYSTEM...\n> LOADING COMPLAINT MANAGEMENT SYSTEM...\n\n[ TECH STACK ]\nPHP, HTML5, CSS3, MySQL\n\n[ DESCRIPTION ]\nDeveloped for a second-year university web deployment assignment. Features a robust backend for user authentication and dynamic database queries. Built entirely with native PHP to establish strong full-stack fundamentals.",
            "2": "> BOOTING SYSTEM...\n> LOADING 3D COCONUT RUNNER...\n\n[ TECH STACK ]\nHTML5, Three.js, JavaScript\n\n[ DESCRIPTION ]\nA browser-based 3D endless runner game featuring custom physics, object pooling, and responsive mechanics. Designed and programmed entirely in the browser with specific branding elements for Jonat Coco Lanka (Pvt) Ltd.",
            "3": "> BOOTING SYSTEM...\n> LOADING PYTHON UTILITIES...\n\n[ TECH STACK ]\nPython, Flask, Tkinter, CustomTkinter\n\n[ DESCRIPTION ]\nVarious application software projects encompassing both desktop user interfaces and web server backends, streamlining operational workflows."
        };

        let typingInterval;
        function playCassette(id, deck, screen) {
            const currentSoftwareData = (typeof window !== 'undefined' && window.softwareData) ? window.softwareData : softwareData;
            deck.innerHTML = `<span class="text-neon font-bold tracking-widest text-sm">PLAYING TAPE 0${id}</span>`;
            deck.classList.add('border-neon', 'bg-[#111]');
            
            clearInterval(typingInterval);
            screen.innerHTML = "";
            const raw = currentSoftwareData[id];
            const text = (typeof raw === 'object' && raw.content) ? raw.content : (raw || "");
            let i = 0;
            
            typingInterval = setInterval(() => {
                screen.innerHTML += text.charAt(i);
                i++;
                if (i >= text.length) {
                    clearInterval(typingInterval);
                    screen.innerHTML += "\n> <span class='blinking-cursor'></span>";
                }
            }, 15);
        }

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x080810);
        scene.fog = new THREE.FogExp2(0x080810, 0.012);

        // Camera shifted to match boardGroup.position.x = 2 offset
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 100);
        camera.position.set(2, 24, 24);
        camera.lookAt(2, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        // --- Lighting ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x111111, 0.55);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
        dirLight.position.set(12, 28, 16);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        dirLight.shadow.camera.top = 15;
        dirLight.shadow.camera.bottom = -15;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const rimLight = new THREE.DirectionalLight(0xdddddd, 0.9);
        rimLight.position.set(-14, 18, -16);
        scene.add(rimLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
        fillLight.position.set(-16, 12, 14);
        scene.add(fillLight);

        const hoverLight = new THREE.PointLight(0xff5e00, 0, 12);
        hoverLight.position.set(0, 1, 0);
        scene.add(hoverLight);

        const boardGroup = new THREE.Group();
        boardGroup.position.x = 2;
        scene.add(boardGroup);

        const squareSize = 2;
        const squaresMap = {};
        const getSquarePos = (f, r) => new THREE.Vector3((f - 3.5) * squareSize, 0, (3.5 - r) * squareSize);

        // --- Board Materials ---
        const darkSqMat = new THREE.MeshStandardMaterial({ color: 0x0d0d0d, roughness: 0.30, metalness: 0.05 });
        const lightSqMat = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.20, metalness: 0.02 });
        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

        // --- Layered Board Base ---
        const boardPedestal = new THREE.Mesh(
            new THREE.BoxGeometry(20, 0.6, 20),
            new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.6, metalness: 0.1 })
        );
        boardPedestal.position.y = -0.45;
        boardPedestal.receiveShadow = true;
        boardGroup.add(boardPedestal);

        const boardFrame = new THREE.Mesh(
            new THREE.BoxGeometry(18.6, 0.35, 18.6),
            new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.5, metalness: 0.1 })
        );
        boardFrame.position.y = -0.15;
        boardFrame.receiveShadow = true;
        boardGroup.add(boardFrame);

        // Black pinstripe trim ring
        const goldTrimMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5, metalness: 0.3 });
        const outerShape = new THREE.Shape();
        outerShape.moveTo(-9.0, -9.0);
        outerShape.lineTo( 9.0, -9.0);
        outerShape.lineTo( 9.0,  9.0);
        outerShape.lineTo(-9.0,  9.0);
        outerShape.closePath();
        const innerPath = new THREE.Path();
        innerPath.moveTo(-8.6, -8.6);
        innerPath.lineTo( 8.6, -8.6);
        innerPath.lineTo( 8.6,  8.6);
        innerPath.lineTo(-8.6,  8.6);
        innerPath.closePath();
        outerShape.holes.push(innerPath);
        const trimGeo = new THREE.ShapeGeometry(outerShape);
        const trim = new THREE.Mesh(trimGeo, goldTrimMat);
        trim.rotation.x = -Math.PI / 2;
        trim.position.y = 0.048;
        boardGroup.add(trim);

        // --- Coordinate labels ---
        function makeLabel(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 64, 64);
            ctx.fillStyle = '#f0f0f0';
            ctx.font = 'bold 36px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }
        const labelMat = (tex) => new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
        const rankNames = ['1','2','3','4','5','6','7','8'];
        for (let f = 0; f < 8; f++) {
            const fileMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 0.75), labelMat(makeLabel(files[f])));
            fileMesh.rotation.x = -Math.PI / 2;
            fileMesh.position.set((f - 3.5) * squareSize, 0.049, 8.9);
            boardGroup.add(fileMesh);
        }
        for (let r = 0; r < 8; r++) {
            const rankMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 0.75), labelMat(makeLabel(rankNames[r])));
            rankMesh.rotation.x = -Math.PI / 2;
            rankMesh.position.set(-8.9, 0.049, (3.5 - r) * squareSize);
            boardGroup.add(rankMesh);
        }

        // --- Squares (micro-gap) ---
        for (let f = 0; f < 8; f++) {
            for (let r = 0; r < 8; r++) {
                const isLight = (f + r) % 2 !== 0;
                const geo = new THREE.BoxGeometry(squareSize - 0.05, 0.12, squareSize - 0.05);
                const square = new THREE.Mesh(geo, isLight ? lightSqMat : darkSqMat);
                square.receiveShadow = true;
                const pos = getSquarePos(f, r);
                square.position.set(pos.x, 0, pos.z);
                const notation = `${files[f]}${r + 1}`;
                squaresMap[notation] = pos;
                square.userData = { isSquare: true, notation: notation };
                boardGroup.add(square);
            }
        }

        // Hover highlight plane
        const highlightGeo = new THREE.PlaneGeometry(1.92, 1.92);
        const highlightMat = new THREE.MeshBasicMaterial({
            color: 0xff5e00, transparent: true, opacity: 0, side: THREE.DoubleSide
        });
        const highlightPlane = new THREE.Mesh(highlightGeo, highlightMat);
        highlightPlane.rotation.x = -Math.PI / 2;
        highlightPlane.position.y = 0.07;
        boardGroup.add(highlightPlane);

        // --- Piece Materials ---
        const pieceMats = {
            white: new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.14, metalness: 0.06 }),
            black: new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.20, metalness: 0.15 }),
            felt:  new THREE.MeshStandardMaterial({ color: 0x0d0d0d, roughness: 0.9,  metalness: 0.0  })
        };

        // --- Shared pedestal base ---
        function buildPedestal(mat) {
            const g = new THREE.Group();
            const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.04, 24), pieceMats.felt);
            pad.position.y = 0.02; pad.castShadow = true;
            const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.78, 0.18, 24), mat);
            rim.position.y = 0.13; rim.castShadow = true;
            const bead = new THREE.Mesh(new THREE.TorusGeometry(0.60, 0.07, 10, 28), mat);
            bead.rotation.x = Math.PI / 2; bead.position.y = 0.26; bead.castShadow = true;
            const riser = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.62, 0.32, 20), mat);
            riser.position.y = 0.44; riser.castShadow = true;
            const collar = new THREE.Mesh(new THREE.TorusGeometry(0.38, 0.055, 8, 24), mat);
            collar.rotation.x = Math.PI / 2; collar.position.y = 0.62; collar.castShadow = true;
            g.add(pad, rim, bead, riser, collar);
            return g;
        }

        // --- Pawn ---
        function createPawn(mat) {
            const g = new THREE.Group();
            g.add(buildPedestal(mat));
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.37, 0.56, 18), mat);
            body.position.y = 0.92; body.castShadow = true;
            const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.26, 0.20, 16), mat);
            neck.position.y = 1.24; neck.castShadow = true;
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 20), mat);
            head.position.y = 1.52; head.castShadow = true;
            g.add(body, neck, head);
            return g;
        }

        // --- Rook ---
        function createRook(mat) {
            const g = new THREE.Group();
            g.add(buildPedestal(mat));
            const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.44, 0.78, 20), mat);
            shaft.position.y = 1.02; shaft.castShadow = true;
            const topCollar = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.42, 0.14, 20), mat);
            topCollar.position.y = 1.46; topCollar.castShadow = true;
            const rookRim = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.56, 0.18, 20), mat);
            rookRim.position.y = 1.58; rookRim.castShadow = true;
            const well = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.44, 0.10, 20), mat);
            well.position.y = 1.72; well.castShadow = true;
            const battleGeo = new THREE.BoxGeometry(0.22, 0.30, 0.22);
            [0, Math.PI/2, Math.PI, 3*Math.PI/2].forEach(function(angle) {
                const b = new THREE.Mesh(battleGeo, mat);
                b.position.set(Math.sin(angle)*0.40, 1.92, Math.cos(angle)*0.40);
                b.castShadow = true;
                g.add(b);
            });
            g.add(shaft, topCollar, rookRim, well);
            return g;
        }

        // --- Knight (extruded horse-head profile) ---
        function createKnight(mat) {
            const g = new THREE.Group();
            g.add(buildPedestal(mat));
            const knightNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.38, 0.52, 16), mat);
            knightNeck.position.y = 0.92; knightNeck.castShadow = true;
            const horseShape = new THREE.Shape();
            horseShape.moveTo(0,     0);
            horseShape.lineTo(0.14,  0.52);
            horseShape.lineTo(0.10,  0.80);
            horseShape.lineTo(0.26,  1.02);
            horseShape.lineTo(0.24,  1.26);
            horseShape.lineTo(0.10,  1.38);
            horseShape.lineTo(-0.10, 1.38);
            horseShape.lineTo(-0.28, 1.14);
            horseShape.lineTo(-0.24, 0.72);
            horseShape.lineTo(-0.18, 0.44);
            horseShape.lineTo(-0.10, 0);
            horseShape.closePath();
            const extSettings = { depth: 0.32, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.06, bevelSegments: 4 };
            const headGeo = new THREE.ExtrudeGeometry(horseShape, extSettings);
            headGeo.center();
            const knightHead = new THREE.Mesh(headGeo, mat);
            knightHead.position.y = 1.42; knightHead.castShadow = true;
            g.add(knightNeck, knightHead);
            return g;
        }

        // --- Bishop ---
        function createBishop(mat) {
            const g = new THREE.Group();
            g.add(buildPedestal(mat));
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.38, 0.84, 18), mat);
            body.position.y = 1.03; body.castShadow = true;
            const bishopCollar = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.055, 8, 22), mat);
            bishopCollar.rotation.x = Math.PI / 2; bishopCollar.position.y = 1.50; bishopCollar.castShadow = true;
            const mitre = new THREE.Mesh(new THREE.SphereGeometry(0.26, 18, 18), mat);
            mitre.scale.set(0.85, 1.28, 0.85);
            mitre.position.y = 1.76; mitre.castShadow = true;
            const notch = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.26, 0.60), mat);
            notch.rotation.y = Math.PI / 4; notch.position.y = 1.76; notch.castShadow = true;
            const pip = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), mat);
            pip.position.y = 2.08; pip.castShadow = true;
            g.add(body, bishopCollar, mitre, notch, pip);
            return g;
        }

        // --- Queen ---
        function createQueen(mat) {
            const g = new THREE.Group();
            g.add(buildPedestal(mat));
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.42, 1.02, 20), mat);
            body.position.y = 1.13; body.castShadow = true;
            const waist = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.055, 8, 24), mat);
            waist.rotation.x = Math.PI / 2; waist.position.y = 1.68; waist.castShadow = true;
            const coronet = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.26, 0.24, 20), mat);
            coronet.position.y = 1.86; coronet.castShadow = true;
            const jewel = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.07, 8, 24), mat);
            jewel.rotation.x = Math.PI / 2; jewel.position.y = 2.02; jewel.castShadow = true;
            const finial = new THREE.Mesh(new THREE.SphereGeometry(0.18, 14, 14), mat);
            finial.position.y = 2.24; finial.castShadow = true;
            g.add(body, waist, coronet, jewel, finial);
            return g;
        }

        // --- King ---
        function createKing(mat) {
            const g = new THREE.Group();
            g.add(buildPedestal(mat));
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.44, 1.14, 20), mat);
            body.position.y = 1.19; body.castShadow = true;
            const kNeck1 = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.055, 8, 24), mat);
            kNeck1.rotation.x = Math.PI / 2; kNeck1.position.y = 1.80; kNeck1.castShadow = true;
            const kNeck2 = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.055, 8, 24), mat);
            kNeck2.rotation.x = Math.PI / 2; kNeck2.position.y = 1.94; kNeck2.castShadow = true;
            const dome = new THREE.Mesh(new THREE.SphereGeometry(0.30, 16, 16), mat);
            dome.scale.set(1.2, 0.6, 1.2); dome.position.y = 2.10; dome.castShadow = true;
            const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.44, 0.08), mat);
            crossV.position.y = 2.44; crossV.castShadow = true;
            const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.08, 0.08), mat);
            crossH.position.y = 2.56; crossH.castShadow = true;
            g.add(body, kNeck1, kNeck2, dome, crossV, crossH);
            return g;
        }

        const piecesRegistry = {};
        const initialPositions = {};

        function placePiece(notation, piece) {
            const pos = squaresMap[notation];
            piece.position.set(pos.x, 0.05, pos.z);
            const isBlack = notation.includes('7') || notation.includes('8');
            piece.rotation.y = isBlack ? Math.PI / 2 : -Math.PI / 2;
            piece.userData = { isPiece: true, notation: notation };
            piece.traverse(function(child) { if (child.isMesh) child.userData = piece.userData; });
            boardGroup.add(piece);
            piecesRegistry[notation] = piece;
            initialPositions[piece.uuid] = piece.position.clone();
        }

        // --- Place all pieces ---
        for (let i = 0; i < 8; i++) {
            placePiece(`${files[i]}2`, createPawn(pieceMats.white));
            placePiece(`${files[i]}7`, createPawn(pieceMats.black));
        }
        ['a1','h1'].forEach(function(n) { placePiece(n, createRook(pieceMats.white)); });
        ['a8','h8'].forEach(function(n) { placePiece(n, createRook(pieceMats.black)); });
        placePiece('b1', createKnight(pieceMats.white));
        placePiece('g1', createKnight(pieceMats.white));
        placePiece('b8', createKnight(pieceMats.black));
        placePiece('g8', createKnight(pieceMats.black));
        ['c1','f1'].forEach(function(n) { placePiece(n, createBishop(pieceMats.white)); });
        ['c8','f8'].forEach(function(n) { placePiece(n, createBishop(pieceMats.black)); });
        placePiece('d1', createQueen(pieceMats.white));
        placePiece('d8', createQueen(pieceMats.black));
        placePiece('e1', createKing(pieceMats.white));
        placePiece('e8', createKing(pieceMats.black));

        let activeHoverTarget = null;
        let isAnimating = false;
        let currentPiece = null;

        let selectedBoardPiece = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        // Map combinations to valid portfolio moves
        const allowedBoardMoves = {
            'd2-d4': 'd4',
            'e2-e4': 'e4',
            'g1-f3': 'Nf3',
            'b1-c3': 'Nc3',
            'c2-c4': 'c4'
        };

        const menuBtns = document.querySelectorAll('.menu-btn');
        const overlay = document.getElementById('content-overlay');
        const modal = document.getElementById('overlay-modal');
        const contentArea = document.getElementById('overlay-content');
        const mainCanvas = document.getElementById('canvas-container');

        function executeMove(moveId, sourceSq, targetSq) {
            if(isAnimating || currentPiece) return;
            isAnimating = true;
            
            currentPiece = piecesRegistry[sourceSq];
            const targetVector = squaresMap[targetSq];
            const data = portfolioData[moveId];

            // Ensure highlight stays on target
            highlightPlane.position.set(targetVector.x, 0.06, targetVector.z);
            gsap.to(highlightPlane.material, { opacity: 0.8, duration: 0.3 });
            gsap.to(hoverLight, { intensity: 3, duration: 0.3 });
            hoverLight.position.set(targetVector.x, 1.5, targetVector.z);

            // GSAP Piece Animation
            const isKnight = moveId.includes('N');
            const timeline = gsap.timeline({
                onComplete: () => {
                    // Show Content Modal
                    if (moveId === 'd4') {
                        contentArea.innerHTML = renderResearchBrowser();
                        bindResearchEvents();
                    } else if (moveId === 'e4') {
                        contentArea.innerHTML = renderCreativeWorks();
                        bindCreativeWorksEvents();
                    } else if (moveId === 'c4') {
                        contentArea.innerHTML = renderScrabbleBoard();
                        bindScrabbleEvents();
                    } else if (moveId === 'Nc3') {
                        contentArea.innerHTML = renderHobbiesTV();
                        bindHobbiesTVEvents();
                    } else if (moveId === 'Nf3') {
                        contentArea.innerHTML = renderSoftwareCassettes();
                        bindSoftwareEvents();
                    } else {
                        contentArea.innerHTML = `
                            <h2 class="text-4xl text-white font-bold mb-6">${data.title}</h2>
                            <div class="h-1 w-12 bg-neon mb-8"></div>
                            <p class="text-lg text-gray-300 leading-relaxed font-serif">${data.text}</p>
                            <p class="mt-8 text-gray-500 italic text-sm">Detailed case studies and full layout can be injected here dynamically.</p>
                        `;
                    }
                    contentArea.scrollTop = 0;
                    
                    overlay.classList.remove('opacity-0', 'pointer-events-none');
                    modal.classList.remove('scale-95');
                    modal.classList.add('scale-100');
                    mainCanvas.classList.add('blurred');
                    isAnimating = false;
                }
            });

            if(isKnight) {
                // Hop animation for Knight
                timeline.to(currentPiece.position, { y: 2, duration: 0.3, ease: "power1.out" })
                        .to(currentPiece.position, { x: targetVector.x, z: targetVector.z, duration: 0.6, ease: "power2.inOut" }, "<")
                        .to(currentPiece.position, { y: 0.05, duration: 0.3, ease: "bounce.out" });
            } else {
                // Slide animation for Pawns
                timeline.to(currentPiece.position, { 
                    x: targetVector.x, z: targetVector.z, duration: 0.8, ease: "power3.inOut" 
                });
            }
        }

        // Hover Effect
        menuBtns.forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                if(isAnimating || currentPiece || selectedBoardPiece) return; // Prevent hover during modal/animation
                const targetSq = btn.getAttribute('data-target');
                const targetVector = squaresMap[targetSq];
                if (targetVector) {
                    activeHoverTarget = targetVector;
                    highlightPlane.position.set(targetVector.x, 0.06, targetVector.z);
                    gsap.to(highlightPlane.material, { opacity: 0.8, duration: 0.3 });
                    gsap.to(hoverLight, { intensity: 3, duration: 0.3 });
                    hoverLight.position.set(targetVector.x, 1.5, targetVector.z);
                }
            });

            btn.addEventListener('mouseleave', () => {
                if(isAnimating || currentPiece || selectedBoardPiece) return;
                activeHoverTarget = null;
                gsap.to(highlightPlane.material, { opacity: 0, duration: 0.3 });
                gsap.to(hoverLight, { intensity: 0, duration: 0.3 });
            });

            // Click Effect (Move Piece -> Show Content)
            btn.addEventListener('click', () => {
                if(isAnimating || currentPiece) return;
                const moveId = btn.getAttribute('data-id');
                const sourceSq = btn.getAttribute('data-source');
                const targetSq = btn.getAttribute('data-target');
                
                selectedBoardPiece = null; // Clear any board selection
                executeMove(moveId, sourceSq, targetSq);
            });
        });

        // Board Click Interaction
        window.addEventListener('click', (event) => {
            // Ignore UI clicks and disable if modal open/animating
            if(event.target.closest('nav') || event.target.closest('#overlay-modal') || isAnimating || currentPiece) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(boardGroup.children, true);

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                
                if (hit.userData.isPiece) {
                    // Select a piece
                    selectedBoardPiece = hit.userData.notation;
                    const pos = squaresMap[selectedBoardPiece];
                    highlightPlane.position.set(pos.x, 0.06, pos.z);
                    gsap.to(highlightPlane.material, { opacity: 0.8, duration: 0.3 });
                    gsap.to(hoverLight, { intensity: 2, duration: 0.3 });
                    hoverLight.position.set(pos.x, 1.5, pos.z);
                } else if (hit.userData.isSquare && selectedBoardPiece) {
                    // Try to move selected piece to square
                    const targetSq = hit.userData.notation;
                    const moveKey = `${selectedBoardPiece}-${targetSq}`;
                    
                    if (allowedBoardMoves[moveKey]) {
                        const moveId = allowedBoardMoves[moveKey];
                        const sourceSq = selectedBoardPiece;
                        selectedBoardPiece = null; // Reset selection
                        executeMove(moveId, sourceSq, targetSq);
                    } else {
                        // Invalid move, deselect
                        selectedBoardPiece = null;
                        gsap.to(highlightPlane.material, { opacity: 0, duration: 0.3 });
                        gsap.to(hoverLight, { intensity: 0, duration: 0.3 });
                    }
                }
            } else {
                // Clicked completely off-board, deselect
                selectedBoardPiece = null;
                gsap.to(highlightPlane.material, { opacity: 0, duration: 0.3 });
                gsap.to(hoverLight, { intensity: 0, duration: 0.3 });
            }
        });

        // Close Overlay Effect (Hide Content -> Return Piece)
        document.getElementById('close-overlay').addEventListener('click', () => {
            if(isAnimating) return;
            isAnimating = true;

            // Hide Modal
            overlay.classList.add('opacity-0', 'pointer-events-none');
            modal.classList.remove('scale-100');
            modal.classList.add('scale-95');
            mainCanvas.classList.remove('blurred');

            // Fade out highlights
            gsap.to(highlightPlane.material, { opacity: 0, duration: 0.3 });
            gsap.to(hoverLight, { intensity: 0, duration: 0.3 });

            // GSAP return animation
            if(currentPiece) {
                const initialPos = initialPositions[currentPiece.uuid];
                gsap.to(currentPiece.position, {
                    x: initialPos.x,
                    y: initialPos.y,
                    z: initialPos.z,
                    duration: 0.8,
                    ease: "power3.inOut",
                    delay: 0.3, // wait for blur to start clearing
                    onComplete: () => {
                        currentPiece = null;
                        selectedBoardPiece = null; // Ensure board selection is cleared
                        isAnimating = false;
                    }
                });
            } else {
                isAnimating = false;
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            // Gentle ambient camera rotation for aesthetic feel
            if(!currentPiece && !isAnimating) {
                camera.position.x = Math.sin(Date.now() * 0.0001) * 2;
                camera.lookAt(0, 0, 0);
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = animate;
    </script>
</body>
</html>
